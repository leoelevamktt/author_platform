name: Add realistic simulated checkout

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-checkout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply checkout patch
        run: python scripts/add_checkout.py

      - name: Commit checkout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add realistic simulated checkout [skip ci]"
          git pull --rebase origin main
          git push origin main

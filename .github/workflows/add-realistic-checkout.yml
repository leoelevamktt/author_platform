name: Add realistic simulated checkout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-checkout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch checkout experience
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          css = r'''
.pay-modal{inset:4vh max(12px,calc((100vw - 1040px)/2));max-height:92vh}.checkout-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:start}.checkout-panel{display:grid;gap:16px}.checkout-panel h2,.checkout-success h2,.checkout-processing h2{font:400 clamp(34px,4vw,52px)/1.04 var(--serif);margin:0}.checkout-secure{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11px}.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.payment-method{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px;background:rgba(255,255,255,.62);cursor:pointer}.payment-method input{width:auto}.payment-fields{display:grid;gap:12px}.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checkout-summary{border:1px solid var(--line);border-radius:20px;padding:20px;background:#f1ebdf;position:sticky;top:10px}.checkout-summary h3{font:500 25px var(--serif);margin:0 0 14px}.checkout-order-item{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.checkout-order-item img{width:54px;height:66px;object-fit:cover;border-radius:8px}.checkout-order-item strong{display:block;font:500 15px var(--serif)}.checkout-order-item small{color:var(--muted)}.checkout-summary-total{display:flex;justify-content:space-between;align-items:end;padding-top:16px}.checkout-summary-total strong{font:500 28px var(--serif)}.pix-box{border:1px solid var(--line);border-radius:16px;padding:15px;background:rgba(255,255,255,.6);display:grid;grid-template-columns:112px 1fr;gap:15px;align-items:center}.pix-qr{width:112px;height:112px;border:9px solid #fff;background:repeating-conic-gradient(#181611 0 25%,#fff 0 50%) 0/18px 18px;box-shadow:0 0 0 1px var(--line)}.pix-key{font-size:12px;word-break:break-all;background:var(--paper);padding:9px;border-radius:9px;margin:7px 0}.sim-badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(157,61,43,.1);color:var(--rust);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.checkout-processing,.checkout-success{text-align:center;padding:55px 20px}.spinner{width:56px;height:56px;margin:0 auto 22px;border:5px solid rgba(24,22,17,.1);border-top-color:var(--rust);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.success-check{width:68px;height:68px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:32px}.order-code{display:inline-block;margin:12px 0 20px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font:600 12px var(--sans)}.download-grid{display:grid;gap:9px;max-width:620px;margin:22px auto}.download-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:11px 13px;text-align:left}.download-row strong{font:500 16px var(--serif)}.processing-status{color:var(--muted);margin-top:8px}.card-hint{font-size:10px;color:var(--muted);margin-top:-4px}.checkout-close{float:right}@media(max-width:800px){.checkout-layout{grid-template-columns:1fr}.checkout-summary{position:static}.payment-methods{grid-template-columns:1fr}.pix-box{grid-template-columns:1fr}.pix-qr{margin:auto}}'''

          if '.pay-modal{' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          checkout_html = r'''
<div class="modal pay-modal" id="checkoutModal">
  <button class="x checkout-close" id="closeCheckout">×</button>
  <div id="checkoutMain">
    <div class="checkout-layout">
      <form class="checkout-panel form" id="checkoutForm">
        <div><span class="sim-badge">Ambiente de demonstração</span><p class="eyebrow" style="margin-top:14px">Finalizar compra</p><h2>Pagamento seguro</h2><p class="note">Simulação visual: nenhum valor será cobrado e nenhum dado de pagamento será enviado.</p></div>
        <label>Nome completo<input name="customerName" autocomplete="name" placeholder="Seu nome completo" required></label>
        <label>E-mail para receber os arquivos<input name="customerEmail" type="email" autocomplete="email" placeholder="voce@email.com" required></label>
        <label>CPF<input name="customerDocument" inputmode="numeric" placeholder="000.000.000-00" required></label>
        <div><p class="eyebrow">Forma de pagamento</p><div class="payment-methods"><label class="payment-method"><input type="radio" name="paymentMethod" value="pix" checked><span><strong>Pix</strong><small style="display:block;color:var(--muted)">Aprovação imediata</small></span></label><label class="payment-method"><input type="radio" name="paymentMethod" value="card"><span><strong>Cartão</strong><small style="display:block;color:var(--muted)">Crédito · simulado</small></span></label></div></div>
        <div class="payment-fields" id="pixFields">
          <div class="pix-box"><div class="pix-qr" aria-hidden="true"></div><div><strong>Pix copia e cola</strong><p class="note">Use apenas para testar a experiência visual.</p><div class="pix-key" id="pixKey">00020126580014BR.GOV.BCB.PIX0136pix-demo@theoavelar.art5204000053039865802BR</div><button class="mini" type="button" id="copyPix">Copiar código Pix</button></div></div>
        </div>
        <div class="payment-fields" id="cardFields" hidden>
          <label>Número do cartão<input id="cardNumber" name="cardNumber" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242"></label>
          <p class="card-hint">Para a simulação, use qualquer sequência de 16 dígitos.</p>
          <label>Nome impresso no cartão<input name="cardName" autocomplete="cc-name" placeholder="NOME COMO NO CARTÃO"></label>
          <div class="pay-row"><label>Validade<input id="cardExpiry" name="cardExpiry" inputmode="numeric" placeholder="MM/AA"></label><label>CVV<input id="cardCvv" name="cardCvv" inputmode="numeric" placeholder="123" maxlength="4"></label></div>
        </div>
        <button class="btn primary" style="width:100%;padding:14px 18px" type="submit">Pagar e concluir compra</button>
        <div class="checkout-secure">🔒 Compra simulada em ambiente local. Nenhum cartão ou Pix é processado.</div>
      </form>
      <aside class="checkout-summary"><p class="eyebrow">Seu pedido</p><h3>Resumo da compra</h3><div id="checkoutItems"></div><div class="checkout-summary-total"><span>Total</span><strong id="checkoutTotal">R$ 0,00</strong></div><p class="note" style="margin-top:14px">Arquivos digitais liberados imediatamente após a aprovação simulada.</p></aside>
    </div>
  </div>
  <div class="checkout-processing" id="checkoutProcessing" hidden><div class="spinner"></div><p class="eyebrow">Processando pagamento</p><h2>Estamos confirmando sua compra.</h2><p class="processing-status" id="processingStatus">Validando dados do pedido...</p></div>
  <div class="checkout-success" id="checkoutSuccess" hidden><div class="success-check">✓</div><p class="eyebrow">Pagamento aprovado</p><h2>Compra concluída.</h2><p>Seu pedido foi aprovado na simulação e os arquivos já estão disponíveis.</p><span class="order-code" id="successOrder"></span><div class="download-grid" id="successDownloads"></div><button class="btn" type="button" id="finishCheckout">Continuar navegando</button></div>
</div>'''

          marker = '<div class="modal admin" id="adminModal">'
          if 'id="checkoutModal"' not in text:
              text = text.replace(marker, checkout_html + '\n' + marker, 1)

          text = text.replace("cart:[],messages:[]};", "cart:[],orders:[],messages:[]};")
          text = text.replace("['No carrinho',state.cart.length]", "['Pedidos',(state.orders||[]).length]")
          text = text.replace("const KEY='author_platform_live_v9';", "const KEY='author_platform_live_v10';")

          anchor = "function openAdmin(){$('#adminModal').classList.add('show');$('#overlay').classList.add('show')}function closeAdmin(){$('#adminModal').classList.remove('show');$('#overlay').classList.remove('show')}"
          checkout_js = r'''
function checkoutItems(){return state.cart.map(id=>state.products.find(p=>p.id===id)).filter(Boolean)}
function refreshCheckoutSummary(){const items=checkoutItems();$('#checkoutItems').innerHTML=items.map(p=>`<div class="checkout-order-item"><img src="${p.image}" alt="${p.title}"><div><strong>${p.title}</strong><small>${p.label}</small></div><b>${money(p.price)}</b></div>`).join('');$('#checkoutTotal').textContent=money(items.reduce((a,p)=>a+p.price,0))}
function openCheckout(){const items=checkoutItems();if(!items.length){alert('Adicione pelo menos um item ao carrinho para continuar.');return}closeCart();refreshCheckoutSummary();$('#checkoutMain').hidden=false;$('#checkoutProcessing').hidden=true;$('#checkoutSuccess').hidden=true;$('#checkoutModal').classList.add('show');$('#overlay').classList.add('show');document.body.classList.add('locked');togglePaymentFields()}
function closeCheckout(){$('#checkoutModal').classList.remove('show');if(!$('#adminModal').classList.contains('show')&&!$('#drawer').classList.contains('open'))$('#overlay').classList.remove('show');document.body.classList.remove('locked')}
function togglePaymentFields(){const method=document.querySelector('input[name="paymentMethod"]:checked')?.value||'pix';$('#pixFields').hidden=method!=='pix';$('#cardFields').hidden=method!=='card';$$('#cardFields input').forEach(i=>i.required=method==='card')}
function downloadPurchased(id){const p=state.products.find(x=>x.id===id);if(!p)return;const body=`Casa Autoral — Theo Avelar\n\n${p.title}\n${p.description}\n\nArquivo demonstrativo liberado após checkout simulado.`;const url=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=p.title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.txt';a.click();URL.revokeObjectURL(url)}
function approveSimulatedPayment(form){const items=checkoutItems();const fd=new FormData(form);const order={id:'CA-'+Date.now().toString().slice(-8),createdAt:new Date().toISOString(),customer:{name:fd.get('customerName'),email:fd.get('customerEmail')},payment:fd.get('paymentMethod')==='pix'?'Pix':'Cartão de crédito',total:items.reduce((a,p)=>a+p.price,0),items:items.map(p=>({id:p.id,title:p.title,price:p.price}))};state.orders=state.orders||[];state.orders.unshift(order);state.cart=[];save();renderCart();renderAdmin();$('#successOrder').textContent=`Pedido ${order.id} · ${money(order.total)}`;$('#successDownloads').innerHTML=order.items.map(i=>`<div class="download-row"><div><strong>${i.title}</strong><small style="display:block;color:var(--muted)">Download digital liberado</small></div><button class="btn primary" type="button" data-download="${i.id}">Baixar</button></div>`).join('');$('#checkoutProcessing').hidden=true;$('#checkoutSuccess').hidden=false;form.reset();togglePaymentFields()}
'''
          if 'function openCheckout()' not in text:
              text = text.replace(anchor, anchor + checkout_js, 1)

          text = text.replace("$('#overlay').onclick=()=>{closeCart();closeAdmin()};", "$('#overlay').onclick=()=>{closeCart();closeAdmin();closeCheckout()};")
          old = "$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='casa-autoral-backup.json';a.click()};$('#checkout').onclick=()=>alert('Checkout demonstrativo: em produção conecte Stripe ou Mercado Pago.');render();"
          new = r'''$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='casa-autoral-backup.json';a.click()};
$('#checkout').onclick=openCheckout;$('#closeCheckout').onclick=closeCheckout;$('#finishCheckout').onclick=closeCheckout;$$('input[name="paymentMethod"]').forEach(r=>r.onchange=togglePaymentFields);$('#copyPix').onclick=async()=>{try{await navigator.clipboard.writeText($('#pixKey').textContent);$('#copyPix').textContent='Código copiado ✓';setTimeout(()=>$('#copyPix').textContent='Copiar código Pix',1400)}catch{$('#copyPix').textContent='Selecione e copie o código'}};
$('#cardNumber').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,16);e.target.value=v.replace(/(.{4})/g,'$1 ').trim()};$('#cardExpiry').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v.length>2?v.slice(0,2)+'/'+v.slice(2):v};$('#cardCvv').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
$('#checkoutForm').onsubmit=e=>{e.preventDefault();const method=document.querySelector('input[name="paymentMethod"]:checked')?.value;if(method==='card'&&$('#cardNumber').value.replace(/\D/g,'').length<16){alert('Digite 16 dígitos para simular o cartão.');return}$('#checkoutMain').hidden=true;$('#checkoutProcessing').hidden=false;$('#processingStatus').textContent='Validando dados do pedido...';setTimeout(()=>$('#processingStatus').textContent=method==='pix'?'Confirmando pagamento Pix...':'Autorizando cartão de crédito...',700);setTimeout(()=>approveSimulatedPayment(e.target),1600)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-download]');if(b)downloadPurchased(b.dataset.download)});render();'''
          if old not in text:
              raise SystemExit('Checkout handler anchor not found; aborting safely')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit checkout changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add realistic simulated checkout [skip ci]"
          git pull --rebase origin main
          git push origin main
